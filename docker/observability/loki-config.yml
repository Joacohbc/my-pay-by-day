auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 720h
  ingestion_rate_mb: 50
  ingestion_burst_size_mb: 100

# `retention_period` above is only a promise until a compactor enforces it: without this block Loki
# never deletes a chunk, so the volume grows without bound and every "last N days" total silently
# spans whatever happens to still be on disk. 30 days is what makes the cost panels comparable to
# OpenRouter's monthly activity page.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
